<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Yazıcı Bilgisayarı</title>
<style>
  :root { --paper:#eef1f6; --card:#fff; --ink:#172033; --muted:#5d6882; --line:#d5dae3;
    --navy:#172033; --cyan:#0a84b6; --cyan-dark:#076a93; --ok:#1d7a4d; --err:#b3261e; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 "Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; }
  header { background:linear-gradient(135deg,#172033,#24365a); color:#fff; padding:14px 24px;
    display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:20px; letter-spacing:.01em; }
  .sync { font-size:14px; color:#c3cbda; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#c0392b; }
  .dot.ok { background:#2ecc71; box-shadow:0 0 0 4px rgba(46,204,113,.2); }
  main { flex:1; display:grid; grid-template-columns:380px 1fr; gap:20px; padding:20px 24px; min-height:0; }
  .col { display:flex; flex-direction:column; gap:16px; min-height:0; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px;
    box-shadow:0 1px 3px rgba(23,32,51,.06); }
  h2 { font-size:15px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; min-width:0; padding:12px; border:1.5px solid var(--line); border-radius:8px;
    font:700 24px ui-monospace,Consolas,monospace; letter-spacing:.2em; text-transform:uppercase; }
  .row input:focus-visible { outline:2px solid var(--cyan); border-color:var(--cyan); }
  button { font:inherit; cursor:pointer; }
  .primary { padding:12px 20px; border:0; border-radius:8px; background:var(--cyan); color:#fff; font-weight:600;
    transition:background .15s, transform .1s; }
  .primary:hover:not(:disabled) { background:var(--cyan-dark); }
  .primary:active:not(:disabled) { transform:scale(.98); }
  .ghost { padding:9px 14px; border:1.5px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); }
  .ghost:hover { background:#f4f6f9; }
  .msg { min-height:1.3em; margin:10px 0 0; color:var(--err); }
  .msg.info { color:var(--muted); }
  .hidden { display:none !important; }
  .conn { display:flex; gap:14px; align-items:center; }
  .qr { width:110px; height:110px; flex:none; }
  .qr svg { width:100%; height:100%; }
  .url { font:700 15px ui-monospace,Consolas,monospace; word-break:break-all; }
  .conn small { color:var(--muted); display:block; margin-top:4px; }

  #detail { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .placeholder { text-align:center; color:var(--muted); }
  .placeholder .big { font-size:48px; }
  .code { font:700 40px ui-monospace,Consolas,monospace; letter-spacing:.18em; }
  .meta { color:var(--muted); margin:2px 0 10px; word-break:break-all; font-size:17px; }
  .amt { font-size:44px; font-weight:700; margin:8px 0 12px; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:3px 14px; border-radius:99px; font-weight:600; font-size:15px; background:#e6edf7; }
  .badge.odendi,.badge.cikti_alindi { background:#dff3e8; color:var(--ok); }
  .badge.yazdiriliyor { background:#e0f1f8; color:var(--cyan-dark); }
  #print { width:100%; margin-top:18px; padding:20px; font-size:20px; }
  #print:disabled { background:#b8c1d1; cursor:not-allowed; }
  .extra { margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); }
  .extra-label { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .extra-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px; width:100%; }
  .btn-mark { padding:13px 14px; border:1.5px solid #27ae60; border-radius:8px; background:#eafaf1;
    color:#1e8449; font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center;
    gap:8px; transition:background .15s, color .15s, border-color .15s, transform .1s; }
  .btn-mark:hover { background:#27ae60; color:#fff; border-color:#27ae60; }
  .btn-mark:active { transform:scale(.98); }
  .btn-ext { padding:13px 14px; border:1.5px solid var(--line); border-radius:8px; background:#f8fafc;
    color:var(--navy); font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center;
    gap:8px; transition:background .15s, color .15s, border-color .15s, transform .1s; }
  .btn-ext:hover { background:#edf5fa; border-color:var(--cyan); color:var(--cyan-dark); }
  .btn-ext:active { transform:scale(.98); }
  @media (max-width:1000px) { main { grid-template-columns:320px 1fr; } }
</style>
</head>
<body>
<header>
  <b>🖨️ Kırtasiye · Yazıcı Bilgisayarı</b>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Sunucuya bağlanılıyor...</span></div>
</header>
<main>
  <div class="col">
    <section>
      <h2>Müşterinin kodu</h2>
      <div class="row">
        <input id="q" maxlength="6" autocomplete="off" placeholder="______" autofocus>
        <button class="primary" id="open">Aç</button>
      </div>
      <p class="msg" id="err" role="alert"></p>
    </section>
    <section>
      <h2>Telefondan bağlan</h2>
      <div class="conn">
        <div class="qr" id="qr"></div>
        <div>
          <div class="url" id="connUrl">...</div>
          <small>Aynı ağdaki telefondan QR'ı okut.</small>
        </div>
      </div>
    </section>
  </div>

  <section id="detail">
    <div class="placeholder" id="empty">
      <div class="big">📄</div>
      <p>Müşterinin kodunu girince sipariş burada görünür.</p>
    </div>
    <div id="card" class="hidden">
      <div class="code" id="cCode"></div>
      <div class="meta" id="cMeta"></div>
      <span class="badge" id="cBadge"></span>
      <div class="amt" id="cAmt"></div>
      <button class="primary" id="print" disabled>Yazdır</button>
      <p class="msg info" id="hint"></p>
      <div class="extra hidden" id="extra">
        <div class="extra-label"><span>⚙</span> Yedek / Alternatif Seçenekler</div>
        <div class="extra-grid">
          <button class="btn-mark" id="mark">
            <span>✓</span> Çıktı alındı olarak işaretle
          </button>
          <button class="btn-ext" id="ext">
            <span>↗</span> PDF'i sistem uygulamasında aç
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const LABEL = { bekliyor:'Ödeme bekliyor', odendi:'Ödendi', yazdiriliyor:'Yazdırılıyor', cikti_alindi:'Çıktı alındı' };
const $ = (id) => document.getElementById(id);
const money = (n) => n.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' TL';
const clean = (e) => String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
let code = null, busy = false, infoLoaded = false;

async function loadInfo() {
  try {
    const d = await api.info();
    $('qr').innerHTML = d.qr; $('connUrl').textContent = d.url; infoLoaded = true;
  } catch { $('connUrl').textContent = 'Adres alınamadı'; }
}

async function tickSync() {
  const s = await api.sync();
  $('dot').classList.toggle('ok', s.ok);
  $('syncTxt').textContent = s.ok ? `Sunucuya bağlı · ${s.ready} sipariş bu bilgisayara indirildi` : 'Sunucuya ulaşılamıyor';
  if (s.ok && !infoLoaded) loadInfo();
}
setInterval(tickSync, 1500); tickSync();

async function refreshOrder() {
  if (!code || busy) return;
  try {
    const o = await api.getOrder(code);
    $('empty').classList.add('hidden'); $('card').classList.remove('hidden');
    $('cCode').textContent = o.code;
    $('cMeta').textContent = `${o.fileName} · ${o.pages} sayfa · ${o.color === 'bw' ? 'Siyah-beyaz' : 'Renkli'}`;
    $('cBadge').className = 'badge ' + o.status; $('cBadge').textContent = LABEL[o.status] || o.status;
    $('cAmt').textContent = money(o.price);
    const locked = o.status === 'bekliyor', done = o.status === 'cikti_alindi';
    $('print').disabled = locked || done || !o.fileReady;
    $('print').textContent = locked ? '🔒 Yazdırma kilitli' : (o.status === 'yazdiriliyor' ? 'Yeniden yazdır' : 'Yazdır');
    $('hint').textContent = locked ? 'Ödeme kasada alınınca bu buton açılır.'
      : done ? 'Bu siparişin çıktısı alındı.'
      : !o.fileReady ? 'Dosya indiriliyor...' : '';
    $('extra').classList.toggle('hidden', o.status !== 'yazdiriliyor');
  } catch (e) {
    $('card').classList.add('hidden'); $('empty').classList.remove('hidden');
    $('err').textContent = clean(e); code = null;
  }
}
setInterval(refreshOrder, 1500);

async function openOrder() {
  $('err').textContent = '';
  code = $('q').value.trim().toUpperCase();
  if (!code) return;
  await refreshOrder();
}
$('open').onclick = openOrder;
$('q').onkeydown = (e) => { if (e.key === 'Enter') openOrder(); };

$('print').onclick = async () => {
  busy = true; $('print').disabled = true; $('err').textContent = '';
  try {
    const r = await api.print(code);
    if (!r.success) $('err').textContent = r.reason === 'cancelled' ? 'Yazdırma iptal edildi. İstersen yeniden yazdırabilirsin.' : 'Yazdırılamadı: ' + r.reason;
  } catch (e) { $('err').textContent = clean(e); }
  busy = false; refreshOrder();
};
$('mark').onclick = async () => {
  try { await api.markPrinted(code); } catch (e) { $('err').textContent = clean(e); }
  refreshOrder();
};
$('ext').onclick = async () => { try { await api.openExternal(code); } catch (e) { $('err').textContent = clean(e); } };
</script>
</body>
</html>
