<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kasa Paneli</title>
    <style>
      :root {
        --paper: #eef1f5;
        --card: #fff;
        --ink: #172033;
        --muted: #5d6882;
        --line: #d5dae3;
        --navy: #172033;
        --cyan: #0a84b6;
        --cyan-dark: #076a93;
        --ok: #1d7a4d;
        --err: #b3261e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.5 "Segoe UI Variable",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      .hidden {
        display: none !important;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .primary {
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--cyan);
        color: #fff;
        font-weight: 600;
      }
      .primary:hover {
        background: var(--cyan-dark);
      }
      .ghost {
        padding: 8px 14px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
      }

      /* Giriş ekranı */
      #login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--navy);
      }
      .loginbox {
        width: 100%;
        max-width: 360px;
        background: var(--card);
        border-radius: 12px;
        padding: 28px 24px;
      }
      .loginbox h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .loginbox p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .loginbox label {
        display: block;
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .loginbox .field {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        margin-bottom: 14px;
        font: inherit;
        color: var(--muted);
      }
      .loginbox .primary {
        width: 100%;
      }

      /* Panel */
      header {
        background: var(--navy);
        color: #fff;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header b {
        font-size: 18px;
      }
      header small {
        color: #b8c1d1;
        display: block;
        line-height: 1.2;
      }
      header .ghost {
        color: #fff;
        border-color: #4a5671;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        font: inherit;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .row input:focus-visible {
        outline: 2px solid var(--cyan);
        border-color: var(--cyan);
      }
      .msg {
        margin: 10px 0 0;
        color: var(--err);
        min-height: 1.2em;
      }
      .found {
        margin-top: 14px;
        padding: 14px;
        border: 1.5px solid var(--cyan);
        border-radius: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
      }
      .found .amt {
        font-size: 30px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .found .meta {
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 14px;
        color: var(--muted);
        font-weight: 600;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .code {
        font:
          700 16px ui-monospace,
          "Cascadia Mono",
          Consolas,
          monospace;
        letter-spacing: 0.12em;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 99px;
        font-weight: 600;
        font-size: 14px;
        background: #e6edf7;
        white-space: nowrap;
      }
      .badge.odendi,
      .badge.cikti_alindi {
        background: #dff3e8;
        color: var(--ok);
      }
      .badge.yazdiriliyor {
        background: #e0f1f8;
        color: var(--cyan-dark);
      }
      .paybtn {
        padding: 6px 12px;
        border: 0;
        border-radius: 6px;
        background: var(--cyan);
        color: #fff;
        font-weight: 600;
      }
      .empty {
        color: var(--muted);
        padding: 12px 8px;
      }
      .scroll {
        overflow-x: auto;
      }
      .undobtn {
        padding: 5px 10px;
        font-size: 14px;
        border: 1.5px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--err);
        font-weight: 600;
      }
      .undobtn:hover {
        background: #fbeceb;
      }
    </style>
  </head>
  <body>
    <div id="login">
      <div class="loginbox">
        <h1>Kasa girişi</h1>
        <p>Kırtasiye personeli için</p>
        <label>Kırtasiye</label>
        <div class="field">GTÜ Kırtasiye</div>
        <label>Kasa hesabı</label>
        <div class="field">kasa-1</div>
        <button class="primary" id="loginBtn">Giriş yap</button>
        <p style="text-align: center; margin: 14px 0 0">
          <a href="/" style="color: var(--muted)">Müşteri sayfasına dön</a>
        </p>
      </div>
    </div>

    <div id="app" class="hidden">
      <header>
        <div><b>Kasa Paneli</b><small>GTÜ Kırtasiye · kasa-1</small></div>
        <button class="ghost" id="logout">Çıkış</button>
      </header>
      <main>
        <section>
          <h2>Kodla sipariş aç</h2>
          <div class="row">
            <input
              id="q"
              maxlength="6"
              placeholder="Müşterinin kodu"
              autocomplete="off"
            />
            <button class="primary" id="open">Aç</button>
          </div>
          <p class="msg" id="msg" role="alert"></p>
          <div class="found hidden" id="found"></div>
        </section>

        <section>
          <h2>Siparişler</h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>Kod</th>
                  <th>Dosya</th>
                  <th>Tür</th>
                  <th class="num">Sayfa</th>
                  <th class="num">Tutar</th>
                  <th>Durum</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <p class="empty hidden" id="empty">Henüz sipariş yok.</p>
        </section>
      </main>
    </div>

    <script>
      const LABEL = {
        bekliyor: "Ödeme bekliyor",
        odendi: "Ödendi",
        yazdiriliyor: "Yazdırılıyor",
        cikti_alindi: "Çıktı alındı",
      };
      const $ = (id) => document.getElementById(id);
      const money = (n) =>
        n.toLocaleString("tr-TR", { maximumFractionDigits: 2 }) + " TL";
      const typeName = (c) => (c === "bw" ? "Siyah-beyaz" : "Renkli");
      let timer = null,
        shown = null;

      function enter() {
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        refresh();
        timer = setInterval(refresh, 2000);
      }
      $("loginBtn").onclick = () => {
        sessionStorage.setItem("kasa", "1");
        enter();
      };
      $("logout").onclick = () => {
        sessionStorage.removeItem("kasa");
        clearInterval(timer);
        location.reload();
      };
      if (sessionStorage.getItem("kasa")) enter();

      async function refresh() {
        const list = await (await fetch("/api/orders")).json();
        const body = $("rows");
        body.innerHTML = "";
        $("empty").classList.toggle("hidden", list.length > 0);
        for (const o of list) {
          const tr = document.createElement("tr");
          const cells = [
            ["code", o.code],
            [null, o.fileName],
            [null, typeName(o.color)],
            ["num", String(o.pages)],
            ["num", money(o.price)],
          ];
          for (const [cls, text] of cells) {
            const td = document.createElement("td");
            if (cls) td.className = cls;
            td.textContent = text;
            tr.append(td);
          }
          const st = document.createElement("td");
          const b = document.createElement("span");
          b.className = "badge " + o.status;
          b.textContent = LABEL[o.status] || o.status;
          st.append(b);
          tr.append(st);
          const act = document.createElement("td");
          if (o.status === "bekliyor") {
            const btn = document.createElement("button");
            btn.className = "paybtn";
            btn.textContent = "Ödendi";
            btn.onclick = () => pay(o.code);
            act.append(btn);
          } else act.append(undoButton(o));
          tr.append(act);
          body.append(tr);
        }
        if (shown) renderFound(list.find((o) => o.code === shown));
      }

      async function pay(code) {
        const r = await fetch("/api/orders/" + code + "/pay", {
          method: "POST",
        });
        if (!r.ok) $("msg").textContent = (await r.json()).error;
        refresh();
      }

      const UNDO_TEXT = {
        cikti_alindi: "Çıktı alındı durumu geri alınacak, sipariş tekrar yazdırılabilir olacak.",
        yazdiriliyor: "Yazdırma iptal edilip sipariş 'Ödendi' durumuna dönecek.",
        odendi: "Ödeme geri alınacak, sipariş 'Ödeme bekliyor' durumuna dönecek (yazdırma tekrar kilitlenir).",
      };
      function undoButton(o) {
        const btn = document.createElement("button");
        btn.className = "undobtn";
        btn.textContent = "Geri al";
        btn.onclick = () => undo(o);
        return btn;
      }
      async function undo(o) {
        if (!confirm(o.code + ": " + UNDO_TEXT[o.status] + "\n\nDevam edilsin mi?")) return;
        const r = await fetch("/api/orders/" + o.code + "/undo", { method: "POST" });
        $("msg").textContent = r.ok ? "" : (await r.json()).error;
        refresh();
      }

      function renderFound(o) {
        const box = $("found");
        if (!o) {
          box.classList.add("hidden");
          return;
        }
        box.classList.remove("hidden");
        box.innerHTML = "";
        const left = document.createElement("div");
        const code = document.createElement("div");
        code.className = "code";
        code.textContent = o.code;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${o.fileName} · ${o.pages} sayfa · ${typeName(o.color)}`;
        const b = document.createElement("span");
        b.className = "badge " + o.status;
        b.textContent = LABEL[o.status] || o.status;
        left.append(code, meta, b);
        const amt = document.createElement("div");
        amt.className = "amt";
        amt.textContent = money(o.price);
        box.append(left, amt);
        if (o.status === "bekliyor") {
          const btn = document.createElement("button");
          btn.className = "primary";
          btn.textContent = "Ödemeyi aldım";
          btn.onclick = () => pay(o.code);
          box.append(btn);
        } else box.append(undoButton(o));
      }

      async function openOrder() {
        const code = $("q").value.trim().toUpperCase();
        $("msg").textContent = "";
        shown = null;
        renderFound(null);
        if (!code) return;
        const r = await fetch("/api/orders/" + encodeURIComponent(code));
        const d = await r.json();
        if (!r.ok) {
          $("msg").textContent = d.error;
          return;
        }
        shown = d.code;
        renderFound(d);
      }
      $("open").onclick = openOrder;
      $("q").onkeydown = (e) => {
        if (e.key === "Enter") openOrder();
      };
    </script>
  </body>
</html>
